---
# Butane Config for Flatcar Container Linux
# Minimal example - SSH keys are fetched from Hetzner metadata API
variant: flatcar
version: 1.0.0

passwd:
  users:
    - name: core
      ssh_authorized_keys:
%{ for key in ssh_public_keys ~}
        - ${key}
%{ endfor ~}

storage:
%{ if length(volumes) > 0 ~}
  filesystems:
%{ for idx, vol in volumes ~}
    - device: /dev/sd${substr("bcdefghijklmnopqrstuvwxyz", idx, 1)}
      path: ${vol.mount_path}
      format: xfs
      label: ${vol.name}
      wipe_filesystem: false
      with_mount_unit: true
%{ endfor ~}
%{ endif ~}

  files:
    - path: /etc/hostname
      mode: 0644
      contents:
        source: http://169.254.169.254/hetzner/v1/metadata/hostname

# Uncomment if you need Docker
# systemd:
#   units:
#     - name: docker.service
#       enabled: true
