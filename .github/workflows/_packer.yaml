name: Packer

on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=hashicorp/packer extractVersion=^v(?<version>.*)$
  PACKER_VERSION: 1.16.2

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer format
        run: packer fmt -check -diff .

      - name: Packer validate
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the hcloud builder requires a token, validate does not use it
          HCLOUD_TOKEN: dummy
          ARCH: ${{ matrix.arch }}
        run: |
          packer init .
          packer validate -var "arch=${ARCH}" .
