name: Terraform

on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$
  TERRAFORM_VERSION: 1.17.2
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: v0.66.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive -diff

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/modules/flatcar-server
          - terraform/modules/k3s-cluster
          - terraform/examples/flatcar-single
          - terraform/examples/flatcar-container
          - terraform/examples/k3s-single
          - terraform/examples/k3s-cluster
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform validate
        working-directory: ${{ matrix.directory }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  butane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Transpiles all Butane configs with the ct provider in strict mode.
      # Only data sources are read, no credentials or resources involved.
      - name: Render Butane configs
        working-directory: tests/butane
        run: |
          terraform init -input=false
          terraform plan -input=false -lock=false
